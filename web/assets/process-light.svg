<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656c2-e76a85-edacf6-112c17ac6da9" role="img" aria-labelledby="process-light-t process-light-d"><title id="process-light-t">shotsheet process: five stages, one artifact each</title><desc id="process-light-d">analyze detects cuts and timecodes with optional ASR; describe samples three frames per shot with vision optional; rules checks duration, the opening hook and the planned caption band from one YAML; export --dry-run prints the plan and writes nothing; write draft emits one microsecond-timed segment per shot. Vision-off and no-audio paths stay visible, and rule warnings stay in the sheet.</desc><defs><linearGradient id="process-light-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7449a"/><stop offset=".55" stop-color="#b25267"/><stop offset="1" stop-color="#8a6490"/></linearGradient><radialGradient id="process-light-halo"><stop stop-color="#b7449a" stop-opacity="0.12"/><stop offset="1" stop-color="#b7449a" stop-opacity="0"/></radialGradient><pattern id="process-light-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbec" stroke-opacity=".45" stroke-width=".7"/></pattern><filter id="process-light-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="process-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b7449a" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 12;animation:flow 5.5s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 6.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-152}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes trace{0%{opacity:0}14%,86%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}
.flow{stroke-dasharray:none}.pulse,.trace{opacity:.7}}
</style><rect width="1000" height="440" rx="16" fill="#fef9fd"/><rect width="1000" height="440" rx="16" fill="url(#process-light-grid)" opacity="0.75"/><ellipse cx="660" cy="149.60000000000002" rx="520" ry="281.6" fill="url(#process-light-halo)"/><text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">CORE PROCESS / EVERY STAGE LEAVES A FILE</text><text x="40" y="78" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="25" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">Five stages, one inspectable artifact at each</text><rect x="40" y="112" width="164" height="112" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><circle cx="62" cy="134" r="11" fill="#b7449a" opacity=".18"/><text x="62" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b7449a" font-weight="700" text-anchor="middle" opacity="1">1</text><text x="80" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">analyze</text><text x="54" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">scenedetect cuts · real fps</text><text x="54" y="188" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">tc_in / tc_out · optional ASR</text><text x="54" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">shots.json + shots.html</text><path d="M204 168L224 168" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="1" marker-end="url(#process-light-arrow)"/><rect x="228" y="112" width="164" height="112" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><circle cx="250" cy="134" r="11" fill="#b7449a" opacity=".18"/><text x="250" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b7449a" font-weight="700" text-anchor="middle" opacity="1">2</text><text x="268" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">describe</text><text x="242" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">3 frames per shot</text><text x="242" y="188" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">vision is optional</text><text x="242" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">fields filled when enabled</text><path d="M392 168L412 168" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="1" marker-end="url(#process-light-arrow)"/><rect x="416" y="112" width="164" height="112" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><circle cx="438" cy="134" r="11" fill="#b7449a" opacity=".18"/><text x="438" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b7449a" font-weight="700" text-anchor="middle" opacity="1">3</text><text x="456" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">rules</text><text x="430" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">duration · hook · caption band</text><text x="430" y="188" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">one YAML source</text><text x="430" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">findings stay in the sheet</text><path d="M580 168L600 168" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="1" marker-end="url(#process-light-arrow)"/><rect x="604" y="112" width="164" height="112" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><circle cx="626" cy="134" r="11" fill="#b7449a" opacity=".18"/><text x="626" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b7449a" font-weight="700" text-anchor="middle" opacity="1">4</text><text x="644" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">export --dry-run</text><text x="618" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">canvas · tracks · segments</text><text x="618" y="188" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">writes nothing</text><text x="618" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">prints the plan</text><path d="M768 168L788 168" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="1" marker-end="url(#process-light-arrow)"/><rect x="792" y="112" width="164" height="112" rx="12" fill="#fef7fc" stroke="#b7449a" stroke-width="1.4" opacity="1"/><circle cx="814" cy="134" r="11" fill="#b7449a" opacity=".18"/><text x="814" y="138" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b7449a" font-weight="700" text-anchor="middle" opacity="1">5</text><text x="832" y="139" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">write draft</text><text x="806" y="168" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">one segment per shot</text><text x="806" y="188" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">microsecond ranges</text><text x="806" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b7449a" font-weight="400" text-anchor="start" opacity="1">draft_content.json</text><rect x="416" y="240" width="164" height="44" rx="12" fill="#fdf3fb" stroke="#f7cbec" stroke-width="1.1" opacity="1" stroke-dasharray="5 5"/><text x="428" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8a6490" font-weight="400"