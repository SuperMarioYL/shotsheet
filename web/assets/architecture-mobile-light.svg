<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656c2-e76a85-edacf6-112c17ac6da9" role="img" aria-labelledby="architecture-mobile-light-t architecture-mobile-light-d"><title id="architecture-mobile-light-t">shotsheet architecture (phone): one process, five modules</title><desc id="architecture-mobile-light-d">A local clip, an optional vision key and cn-platforms.yaml feed analyze, describe, rules, shotlist_html and jianying. The outputs are shots.json, the A4 shots.html and a Jianying draft folder; the FastAPI page writes edits back to the same shots.json. Each job uses a temporary working directory and there is no database.</desc><defs><linearGradient id="architecture-mobile-light-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7449a"/><stop offset=".55" stop-color="#b25267"/><stop offset="1" stop-color="#8a6490"/></linearGradient><radialGradient id="architecture-mobile-light-halo"><stop stop-color="#b7449a" stop-opacity="0.12"/><stop offset="1" stop-color="#b7449a" stop-opacity="0"/></radialGradient><pattern id="architecture-mobile-light-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbec" stroke-opacity=".45" stroke-width=".7"/></pattern><filter id="architecture-mobile-light-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="architecture-mobile-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b7449a" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 12;animation:flow 5.5s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 6.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-152}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes trace{0%{opacity:0}14%,86%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}
.flow{stroke-dasharray:none}.pulse,.trace{opacity:.7}}
</style><rect width="520" height="900" rx="16" fill="#fef9fd"/><rect width="520" height="900" rx="16" fill="url(#architecture-mobile-light-grid)" opacity="0.75"/><ellipse cx="343.2" cy="306" rx="270.40000000000003" ry="576" fill="url(#architecture-mobile-light-halo)"/><text x="28" y="36" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">ARCHITECTURE / FIVE MODULES</text><text x="28" y="74" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">One process, five modules,</text><text x="28" y="102" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">no database</text><text x="28" y="132" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">you bring</text><rect x="28" y="142" width="464" height="44" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="161" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">local clip</text><text x="42" y="177" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">mp4 · mov · mkv · real fps</text><rect x="28" y="194" width="464" height="44" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1" stroke-dasharray="6 5"/><text x="42" y="213" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">vision key (optional)</text><text x="42" y="229" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">ARK_API_KEY / DASHSCOPE_API_KEY</text><rect x="28" y="246" width="464" height="44" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="265" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">cn-platforms.yaml</text><text x="42" y="281" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">duration · hook · safe area</text><path d="M260 298V314" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-mobile-light-arrow)"/><text x="28" y="332" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">modules</text><rect x="28" y="344" width="464" height="50" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="365" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#b7449a" font-weight="600" text-anchor="start" opacity="1">pipeline/analyze.py</text><text x="42" y="383" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">scenedetect · fps · optional ASR</text><rect x="28" y="402" width="464" height="50" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="423" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#b7449a" font-weight="600" text-anchor="start" opacity="1">pipeline/describe.py</text><text x="42" y="441" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">3 frames per shot → vision</text><rect x="28" y="460" width="464" height="50" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="481" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#b7449a" font-weight="600" text-anchor="start" opacity="1">pipeline/rules.py</text><text x="42" y="499" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">reads the YAML only</text><rect x="28" y="518" width="464" height="50" rx="12" fill="#fef7fc" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="539" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#b7449a" font-weight="600" text-anchor="start" opacity="1">render/shotlist_html.py</text><text x="42" y="557" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">A4 sheet · timeline + rules</text><rect x="28" y="576" width="464" height="50" rx="12" fill="#fef7fc" stroke="#b7449a" stroke-width="1.4" opacity="1"/><text x="42" y="597" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#b7449a" font-weight="600" text-anchor="start" opacity="1">render/jianying.py</text><text x="42" y="615" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">tc → µs · draft_content.json</text><path d="M260 634V650" fill="none" stroke="#b7449a" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-mobile-light-arrow)"/><text x="28" y="668" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">outputs</text><rect x="28" y="680" width="464" height="46" rx="12" fill="#fdf3fb" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="699" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">shots.json · shots.html</text><text x="42" y="717" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">one record · A4 print layout</text><rect x="28" y="734" width="464" height="46" rx="12" fill="#fdf3fb" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="753" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">jianying/</text><text x="42" y="771" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacity="1">root_meta_info.json + &lt;draft-name&gt;/</text><rect x="28" y="788" width="464" height="46" rx="12" fill="#fdf3fb" stroke="#f7cbec" stroke-width="1.1" opacity="1"/><text x="42" y="807" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162b" font-weight="600" text-anchor="start" opacity="1">FastAPI page</text><text x="42" y="825" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e80" font-weight="400" text-anchor="start" opacit