<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656c2-e76a85-edacf6-112c17ac6da9" role="img" aria-labelledby="architecture-dark-t architecture-dark-d"><title id="architecture-dark-t">shotsheet architecture: one process, five modules</title><desc id="architecture-dark-d">A local clip, an optional vision key and cn-platforms.yaml feed analyze, describe, rules, shotlist_html and jianying. The outputs are shots.json, the A4 shots.html and a Jianying draft folder; the FastAPI page writes edits back to the same shots.json. Each job uses a temporary working directory and there is no database.</desc><defs><linearGradient id="architecture-dark-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e656c2"/><stop offset=".55" stop-color="#e76a85"/><stop offset="1" stop-color="#edacf6"/></linearGradient><radialGradient id="architecture-dark-halo"><stop stop-color="#e656c2" stop-opacity="0.22"/><stop offset="1" stop-color="#e656c2" stop-opacity="0"/></radialGradient><pattern id="architecture-dark-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a1837" stroke-opacity=".45" stroke-width=".7"/></pattern><filter id="architecture-dark-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="architecture-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656c2" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 12;animation:flow 5.5s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 6.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-152}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes trace{0%{opacity:0}14%,86%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}
.flow{stroke-dasharray:none}.pulse,.trace{opacity:.7}}
</style><rect width="1000" height="540" rx="16" fill="#0a0710"/><rect width="1000" height="540" rx="16" fill="url(#architecture-dark-grid)" opacity="0.5"/><ellipse cx="660" cy="183.60000000000002" rx="520" ry="345.6" fill="url(#architecture-dark-halo)"/><text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">ARCHITECTURE / ONE PROCESS, FIVE MODULES</text><text x="40" y="78" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">One process, five modules, no database</text><text x="40" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">YOU BRING</text><text x="330" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">MODULES</text><text x="690" y="114" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">OUTPUTS</text><rect x="40" y="132" width="240" height="72" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="54" y="158" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">local clip</text><text x="54" y="180" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">mp4 · mov · mkv · real fps</text><rect x="40" y="222" width="240" height="72" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1" stroke-dasharray="6 5"/><text x="54" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">vision key (optional)</text><text x="54" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">ARK_API_KEY / DASHSCOPE_API_KEY</text><rect x="40" y="312" width="240" height="72" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="54" y="338" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">cn-platforms.yaml</text><text x="54" y="360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">duration · hook · safe area</text><rect x="330" y="132" width="290" height="52" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="344" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#e656c2" font-weight="600" text-anchor="start" opacity="1">pipeline/analyze.py</text><text x="344" y="172" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">scenedetect · fps · optional ASR</text><path d="M475 184V192" fill="none" stroke="#e656c2" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-dark-arrow)"/><rect x="330" y="196" width="290" height="52" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="344" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#e656c2" font-weight="600" text-anchor="start" opacity="1">pipeline/describe.py</text><text x="344" y="236" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">3 frames per shot → vision</text><path d="M475 248V256" fill="none" stroke="#e656c2" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-dark-arrow)"/><rect x="330" y="260" width="290" height="52" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="344" y="282" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#e656c2" font-weight="600" text-anchor="start" opacity="1">pipeline/rules.py</text><text x="344" y="300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">reads the YAML only</text><path d="M475 312V320" fill="none" stroke="#e656c2" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-dark-arrow)"/><rect x="330" y="324" width="290" height="52" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="344" y="346" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#e656c2" font-weight="600" text-anchor="start" opacity="1">render/shotlist_html.py</text><text x="344" y="364" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">A4 sheet · timeline + rules</text><path d="M475 376V384" fill="none" stroke="#e656c2" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#architecture-dark-arrow)"/><rect x="330" y="388" width="290" height="52" rx="12" fill="#13101d" stroke="#e656c2" stroke-width="1.4" opacity="1"/><text x="344" y="410" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#e656c2" font-weight="600" text-anchor="start" opacity="1">render/jianying.py</text><text x="344" y="428" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">tc → µs · draft_content.json</text><rect x="690" y="132" width="270" height="88" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="706" y="157" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.json</text><text x="706" y="178" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">one diffable record</text><text x="706" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">source · rules · shots[]</text><rect x="690" y="238" width="270" height="88" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="706" y="263" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.html</text><text x="706" y="284" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">A4 print layout</text><text x="706" y="304" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">12 shots on one page</text><rect x="690" y="344" width="270" height="88" rx="12" fill="#140d1b" stroke="#3a1