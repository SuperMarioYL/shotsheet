<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656c2-e76a85-edacf6-112c17ac6da9" role="img" aria-labelledby="capabilities-dark-t capabilities-dark-d"><title id="capabilities-dark-t">shotsheet capabilities: inputs, outputs and scope</title><desc id="capabilities-dark-d">Inputs are a local clip, an optional vision provider (Doubao by default, Qwen VL as the alternative) and cn-platforms.yaml with Douyin, Xiaohongshu and Channels profiles. Outputs are shots.json, the A4 shots.html and a plaintext Jianying draft. URL download, encrypted 10.1 import, batch queue, shared templates and multi-account are not in v0.1.</desc><defs><linearGradient id="capabilities-dark-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e656c2"/><stop offset=".55" stop-color="#e76a85"/><stop offset="1" stop-color="#edacf6"/></linearGradient><radialGradient id="capabilities-dark-halo"><stop stop-color="#e656c2" stop-opacity="0.22"/><stop offset="1" stop-color="#e656c2" stop-opacity="0"/></radialGradient><pattern id="capabilities-dark-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a1837" stroke-opacity=".45" stroke-width=".7"/></pattern><filter id="capabilities-dark-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="capabilities-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656c2" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 12;animation:flow 5.5s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 6.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-152}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes trace{0%{opacity:0}14%,86%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}
.flow{stroke-dasharray:none}.pulse,.trace{opacity:.7}}
</style><rect width="1000" height="470" rx="16" fill="#0a0710"/><rect width="1000" height="470" rx="16" fill="url(#capabilities-dark-grid)" opacity="0.5"/><ellipse cx="660" cy="159.8" rx="520" ry="300.8" fill="url(#capabilities-dark-halo)"/><text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">CAPABILITIES / WHAT SHIPS, WHAT IT NEEDS</text><text x="40" y="78" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="25" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">Three artifacts from one local run</text><text x="40" y="118" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">INPUTS</text><rect x="40" y="132" width="280" height="60" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="54" y="156" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">local clip</text><text x="54" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">mp4 · mov · mkv</text><rect x="40" y="208" width="280" height="60" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1" stroke-dasharray="6 5"/><text x="54" y="232" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">vision provider</text><text x="54" y="252" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">Doubao default · Qwen VL</text><rect x="40" y="284" width="280" height="60" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="54" y="308" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">cn-platforms.yaml</text><text x="54" y="328" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">douyin · xiaohongshu · channels</text><text x="660" y="118" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">OUTPUTS</text><rect x="660" y="132" width="300" height="60" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="674" y="156" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.json</text><text x="674" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">diffable · tc_in per row</text><rect x="660" y="208" width="300" height="60" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="674" y="232" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.html</text><text x="674" y="252" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">A4 print layout</text><rect x="660" y="284" width="300" height="60" rx="12" fill="#140d1b" stroke="