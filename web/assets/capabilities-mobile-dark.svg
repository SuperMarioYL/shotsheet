<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 780" width="520" height="780" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656c2-e76a85-edacf6-112c17ac6da9" role="img" aria-labelledby="capabilities-mobile-dark-t capabilities-mobile-dark-d"><title id="capabilities-mobile-dark-t">shotsheet capabilities (phone): inputs, outputs and scope</title><desc id="capabilities-mobile-dark-d">Inputs are a local clip, an optional vision provider (Doubao by default, Qwen VL as the alternative) and cn-platforms.yaml with Douyin, Xiaohongshu and Channels profiles. Outputs are shots.json, the A4 shots.html and a plaintext Jianying draft. URL download, encrypted 10.1 import, batch queue, shared templates and multi-account are not in v0.1.</desc><defs><linearGradient id="capabilities-mobile-dark-neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e656c2"/><stop offset=".55" stop-color="#e76a85"/><stop offset="1" stop-color="#edacf6"/></linearGradient><radialGradient id="capabilities-mobile-dark-halo"><stop stop-color="#e656c2" stop-opacity="0.22"/><stop offset="1" stop-color="#e656c2" stop-opacity="0"/></radialGradient><pattern id="capabilities-mobile-dark-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a1837" stroke-opacity=".45" stroke-width=".7"/></pattern><filter id="capabilities-mobile-dark-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="capabilities-mobile-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656c2" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:7 12;animation:flow 5.5s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 6.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-152}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes trace{0%{opacity:0}14%,86%{opacity:.8}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}
.flow{stroke-dasharray:none}.pulse,.trace{opacity:.7}}
</style><rect width="520" height="780" rx="16" fill="#0a0710"/><rect width="520" height="780" rx="16" fill="url(#capabilities-mobile-dark-grid)" opacity="0.5"/><ellipse cx="343.2" cy="265.20000000000005" rx="270.40000000000003" ry="499.2" fill="url(#capabilities-mobile-dark-halo)"/><text x="28" y="36" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">CAPABILITIES / SHIPS AND NEEDS</text><text x="28" y="72" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">Three artifacts</text><text x="28" y="98" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">from one local run</text><rect x="28" y="118" width="464" height="104" rx="12" fill="#13101d" stroke="#e656c2" stroke-width="1.4" opacity="1"/><text x="44" y="142" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#e656c2" font-weight="700" text-anchor="start" opacity="1">SHOTSHEET CONTRACT</text><text x="44" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#fbeefd" font-weight="400" text-anchor="start" opacity="1">source · rules · shots[]</text><text x="44" y="186" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">tc_in on every row · diffable JSON</text><text x="44" y="206" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">no database</text><text x="28" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">inputs</text><rect x="28" y="262" width="464" height="40" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="42" y="279" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">local clip</text><text x="42" y="295" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">mp4 · mov · mkv</text><rect x="28" y="310" width="464" height="40" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1" stroke-dasharray="6 5"/><text x="42" y="327" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">vision provider</text><text x="42" y="343" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">Doubao default · Qwen VL</text><rect x="28" y="358" width="464" height="40" rx="12" fill="#13101d" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="42" y="375" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">cn-platforms.yaml</text><text x="42" y="391" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">douyin · xiaohongshu · channels</text><text x="28" y="418" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">outputs</text><rect x="28" y="430" width="464" height="40" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="42" y="447" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.json</text><text x="42" y="463" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">diffable · tc_in per row</text><rect x="28" y="478" width="464" height="40" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="42" y="495" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">shots.html</text><text x="42" y="511" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">A4 print layout</text><rect x="28" y="526" width="464" height="40" rx="12" fill="#140d1b" stroke="#3a1837" stroke-width="1.1" opacity="1"/><text x="42" y="543" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#fbeefd" font-weight="600" text-anchor="start" opacity="1">Jianying draft</text><text x="42" y="559" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">plaintext 5.x/6.x · µs</text><line x1="28" y1="592" x2="492" y2="592" stroke="#3a1837" stroke-width="1" stroke-opacity="1"/><text x="28" y="616" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#edacf6" font-weight="700" text-anchor="start" opacity="1">NOT IN v0.1</text><rect x="28" y="626" width="76.86000000000001" height="22" rx="11" fill="#13101d" stroke="#3a1837" stroke-width="1"/><text x="66.43" y="640.24" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#b29cbd" font-weight="600" text-anchor="middle" opacity="1">URL download</text><rect x="188" y="626" width="121.00500000000001" height="22" rx="11" fill="#13101d" stroke="#3a1837" stroke-width="1"/><text x="248.5025" y="640.24" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#b29cbd" font-weight="600" text-anchor="middle" opacity="1">10.1 encrypted import</text><rect x="348" y="626" width="71.95500000000001" height="22" rx="11" fill="#13101d" stroke="#3a1837" stroke-width="1"/><text x="383.9775" y="640.24" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#b29cbd" font-weight="600" text-anchor="middle" opacity="1">batch queue</text><rect x="28" y="656" width="96.48" height="22" rx="11" fill="#13101d" stroke="#3a1837" stroke-width="1"/><text x="76.24000000000001" y="670.24" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#b29cbd" font-weight="600" text-anchor="middle" opacity="1">shared templates</text><rect x="188" y="656" width="81.76500000000001" height="22" rx="11" fill="#13101d" stroke="#3a1837" stroke-width="1"/><text x="228.8825" y="670.24" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#b29cbd" font-weight="600" text-anchor="middle" opacity="1">multi-account</text><text x="28" y="712" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">Vision off: nothing leaves the machine</text><text x="28" y="734" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">Local files only · no hosted service</text><text x="28" y="762" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#b29cbd" font-weight="400" text-anchor="start" opacity="1">Doubao default · Qwen VL alternative</text></svg>
