<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650" role="img" aria-labelledby="t d">
<title id="t">ShotSheet 架构</title>
<desc id="d">浏览器、FastAPI、分析管线与三类输出的纵向架构图。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .flow { stroke-dasharray: 5 8; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
  .drift { animation: drift 4.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  .travel { animation: travel 7s linear infinite; }
  @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(700px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .drift, .travel, .spin, .float { animation: none !important; }
  }
</style>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#1b2a37" stroke-width="1" stroke-opacity=".55"/>
  </pattern>
  <radialGradient id="glow" cx="62%" cy="42%" r="68%">
    <stop offset="0" stop-color="#5eead4" stop-opacity=".20"/>
    <stop offset=".55" stop-color="#7dd3fc" stop-opacity=".07"/>
    <stop offset="1" stop-color="#070c12" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="400" height="650" fill="#070c12"/>
<rect width="400" height="650" fill="url(#grid)"/>
<rect width="400" height="650" fill="url(#glow)"/>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea3b5"/></marker><text x="24" y="44" font-size="26" font-weight="700" fill="#e8f2f8" text-anchor="start" >架构</text><text x="24" y="68" font-size="12" font-weight="400" fill="#8ea3b5" text-anchor="start" >单进程 · 单目录 · 无数据库</text><rect x="24" y="88" width="352" height="78" rx="12" fill="#0e1721" stroke="#263543" stroke-width="1.2" /><text x="40" y="118" font-size="14" font-weight="600" fill="#e8f2f8" text-anchor="start" >浏览器单页</text><text x="40" y="142" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >拖入 · 逐镜编辑 · 导出</text><path d="M200 166 V184" fill="none" stroke="#8ea3b5" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="186" width="352" height="78" rx="12" fill="#0e1721" stroke="#263543" stroke-width="1.2" /><text x="40" y="216" font-size="14" font-weight="600" fill="#e8f2f8" text-anchor="start" >FastAPI</text><text x="40" y="240" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >串行任务队列 + 静态页</text><path d="M200 264 V282" fill="none" stroke="#8ea3b5" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="284" width="352" height="78" rx="12" fill="#13202b" stroke="#263543" stroke-width="1.2" /><text x="40" y="314" font-size="14" font-weight="600" fill="#5eead4" text-anchor="start" >probe → cut → transcribe</text><text x="40" y="338" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >ffprobe · scenedetect · faster-whisper</text><path d="M200 362 V380" fill="none" stroke="#8ea3b5" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="382" width="352" height="78" rx="12" fill="#13202b" stroke="#263543" stroke-width="1.2" /><text x="40" y="412" font-size="14" font-weight="600" fill="#5eead4" text-anchor="start" >describe → apply_rules</text><text x="40" y="436" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >视觉模型 · cn-platforms.yaml</text><path d="M200 460 V478" fill="none" stroke="#8ea3b5" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="24" y="480" width="352" height="78" rx="12" fill="#0e1721" stroke="#263543" stroke-width="1.2" /><text x="40" y="510" font-size="14" font-weight="600" fill="#e8f2f8" text-anchor="start" >render</text><text x="40" y="534" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >shots.json · HTML · 剪映 draft</text><text x="24" y="608" font-size="11" font-weight="400" fill="#8ea3b5" text-anchor="start" >规则只读 YAML；换平台不改编排。</text>
</svg>
