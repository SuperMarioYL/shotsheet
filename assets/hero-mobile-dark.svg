<svg xmlns="http://www.w3.org/2000/svg" width="400" height="540" viewBox="0 0 400 540" role="img" aria-labelledby="t d">
<title id="t">拉片单 ShotSheet</title>
<desc id="d">拉片单把一条短视频拆成带时间码的分镜表，并导出剪映参考时间线。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .flow { stroke-dasharray: 5 8; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
  .drift { animation: drift 4.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  .travel { animation: travel 7s linear infinite; }
  @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(700px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .drift, .travel, .spin, .float { animation: none !important; }
  }
</style>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#1b2a37" stroke-width="1" stroke-opacity=".55"/>
  </pattern>
  <radialGradient id="glow" cx="62%" cy="42%" r="68%">
    <stop offset="0" stop-color="#5eead4" stop-opacity=".20"/>
    <stop offset=".55" stop-color="#7dd3fc" stop-opacity=".07"/>
    <stop offset="1" stop-color="#070c12" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="400" height="540" fill="#070c12"/>
<rect width="400" height="540" fill="url(#grid)"/>
<rect width="400" height="540" fill="url(#glow)"/>
