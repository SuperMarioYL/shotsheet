<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650" role="img" aria-labelledby="t d">
<title id="t">ShotSheet 能力与集成</title>
<desc id="d">输入、视觉 provider、平台规则、输出与 v0.2 规划的纵向连接图。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .flow { stroke-dasharray: 5 8; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
  .drift { animation: drift 4.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  .travel { animation: travel 7s linear infinite; }
  @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(700px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .drift, .travel, .spin, .float { animation: none !important; }
  }
</style>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#dde8ef" stroke-width="1" stroke-opacity=".55"/>
  </pattern>
  <radialGradient id="glow" cx="62%" cy="42%" r="68%">
    <stop offset="0" stop-color="#0f766e" stop-opacity=".20"/>
    <stop offset=".55" stop-color="#0369a1" stop-opacity=".07"/>
    <stop offset="1" stop-color="#f7fafc" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="400" height="650" fill="#f7fafc"/>
<rect width="400" height="650" fill="url(#grid)"/>
<rect width="400" height="650" fill="url(#glow)"/>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#516a7d"/></marker><text x="24" y="44" font-size="26" font-weight="700" fill="#0c1a25" text-anchor="start" >能力与集成</text><text x="24" y="68" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >一个契约，接本地分析、两个视觉 provider、三套规则</text><circle cx="200" cy="150" r="54" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="200" y="145" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle" >ShotSheet</text><text x="200" y="165" font-size="10" font-weight="400" fill="#516a7d" text-anchor="middle" >shots.json · tc_in</text><rect x="24" y="230" width="352" height="48" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1" /><text x="38" y="250" font-size="12" font-weight="600" fill="#0369a1" text-anchor="start" >本地视频输入</text><text x="38" y="268" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >mp4 · mov · mkv</text><rect x="24" y="286" width="352" height="48" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1" /><text x="38" y="306" font-size="12" font-weight="600" fill="#0369a1" text-anchor="start" >视觉 provider</text><text x="38" y="324" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >豆包 · 通义 qwen3-vl</text><rect x="24" y="342" width="352" height="48" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="1" /><text x="38" y="362" font-size="12" font-weight="600" fill="#a16207" text-anchor="start" >平台规则</text><text x="38" y="380" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >抖音 · 小红书 · 视频号</text><rect x="24" y="398" width="352" height="48" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1" /><text x="38" y="418" font-size="12" font-weight="600" fill="#0f766e" text-anchor="start" >打印物料</text><text x="38" y="436" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >A4 分镜表 HTML</text><rect x="24" y="454" width="352" height="48" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1" /><text x="38" y="474" font-size="12" font-weight="600" fill="#0f766e" text-anchor="start" >剪映参考时间线</text><text x="38" y="492" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >draft_content.json</text><rect x="24" y="510" width="352" height="48" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1" /><text x="38" y="530" font-size="12" font-weight="600" fill="#0369a1" text-anchor="start" >本地 ASR</text><text x="38" y="548" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >faster-whisper（可选）</text><rect x="24" y="580" width="352" height="54" rx="8" fill="#edf4f8" stroke="#516a7d" stroke-width="1" stroke-dasharray="4 5"/><text x="38" y="602" font-size="11" font-weight="600" fill="#516a7d" text-anchor="start" >v0.2 规划（未实现）</text><text x="38" y="620" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >批量队列 · 共享模板库</text>
</svg>
