<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="t d">
<title id="t">ShotSheet 架构</title>
<desc id="d">浏览器、FastAPI 与五段分析管线，输出 shots.json、分镜表 HTML 和剪映草稿。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .flow { stroke-dasharray: 5 8; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
  .drift { animation: drift 4.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  .travel { animation: travel 7s linear infinite; }
  @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(700px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .drift, .travel, .spin, .float { animation: none !important; }
  }
</style>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#dde8ef" stroke-width="1" stroke-opacity=".55"/>
  </pattern>
  <radialGradient id="glow" cx="62%" cy="42%" r="68%">
    <stop offset="0" stop-color="#0f766e" stop-opacity=".20"/>
    <stop offset=".55" stop-color="#0369a1" stop-opacity=".07"/>
    <stop offset="1" stop-color="#f7fafc" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="980" height="500" fill="#f7fafc"/>
<rect width="980" height="500" fill="url(#grid)"/>
<rect width="980" height="500" fill="url(#glow)"/>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#516a7d"/></marker><text x="40" y="46" font-size="20" font-weight="700" fill="#0c1a25" text-anchor="start" >架构：单进程、单目录、无数据库</text><text x="40" y="70" font-size="12" font-weight="400" fill="#516a7d" text-anchor="start" >浏览器只负责上传与逐镜编辑；分析、规则与导出都在本机完成。</text><rect x="40" y="96" width="210" height="92" rx="12" fill="#ffffff" stroke="#c9d9e4" stroke-width="1.2" /><text x="56" y="122" font-size="14" font-weight="600" fill="#0c1a25" text-anchor="start" >浏览器单页</text><text x="56" y="146" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >拖入 · 逐镜编辑 · 导出</text><text x="56" y="166" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >127.0.0.1 本地打开</text><path d="M250 142 H300" fill="none" stroke="#516a7d" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="96" width="220" height="92" rx="12" fill="#ffffff" stroke="#c9d9e4" stroke-width="1.2" /><text x="316" y="122" font-size="14" font-weight="600" fill="#0c1a25" text-anchor="start" >FastAPI</text><text x="316" y="146" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >串行任务队列 + 静态页</text><text x="316" y="166" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >上传文件 → 临时目录</text><text x="560" y="122" font-size="14" font-weight="600" fill="#0369a1" text-anchor="start" >pipeline（纯函数串联）</text><text x="560" y="146" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >每个任务一个临时工作目录，跑完可删</text><rect x="40" y="226" width="160" height="96" rx="12" fill="#edf4f8" stroke="#c9d9e4" stroke-width="1.2" /><text x="54" y="250" font-size="13" font-weight="600" fill="#0f766e" text-anchor="start" >probe</text><text x="54" y="274" font-size="11" font-weight="400" fill="#0c1a25" text-anchor="start" >scenedetect</text><text x="54" y="296" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >时长 · 帧率</text><rect x="225" y="226" width="160" height="96" rx="12" fill="#edf4f8" stroke="#c9d9e4" stroke-width="1.2" /><text x="239" y="250" font-size="13" font-weight="600" fill="#0f766e" text-anchor="start" >cut</text><text x="239" y="274" font-size="11" font-weight="400" fill="#0c1a25" text-anchor="start" >ContentDetector</text><text x="239" y="296" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >镜头边界</text><rect x="410" y="226" width="160" height="96" rx="12" fill="#edf4f8" stroke="#c9d9e4" stroke-width="1.2" /><text x="424" y="250" font-size="13" font-weight="600" fill="#0f766e" text-anchor="start" >transcribe</text><text x="424" y="274" font-size="11" font-weight="400" fill="#0c1a25" text-anchor="start" >faster-whisper</text><text x="424" y="296" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >ASR 字幕（可选）</text><rect x="595" y="226" width="160" height="96" rx="12" fill="#edf4f8" stroke="#c9d9e4" stroke-width="1.2" /><text x="609" y="250" font-size="13" font-weight="600" fill="#0f766e" text-anchor="start" >describe</text><text x="609" y="274" font-size="11" font-weight="400" fill="#0c1a25" text-anchor="start" >视觉模型</text><text x="609" y="296" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >景别 · 机位 · 运镜</text><rect x="780" y="226" width="160" height="96" rx="12" fill="#edf4f8" stroke="#c9d9e4" stroke-width="1.2" /><text x="794" y="250" font-size="13" font-weight="600" fill="#0f766e" text-anchor="start" >apply_rules</text><text x="794" y="274" font-size="11" font-weight="400" fill="#0c1a25" text-anchor="start" >cn-platforms.yaml</text><text x="794" y="296" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >时长 · 钩子 · 安全区</text><path d="M200 274 H223" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M385 274 H408" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M570 274 H593" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M755 274 H778" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M190 188 V226" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><text x="200" y="210" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >分析</text><rect x="595" y="188" width="120" height="26" rx="8" fill="#edf4f8" stroke="#0369a1" stroke-width="1" /><text x="655.0" y="204.6" font-size="10" font-weight="400" fill="#0369a1" text-anchor="middle" >豆包 / 通义 VL</text><path d="M655 214 V226" fill="none" stroke="#0369a1" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="410" y="188" width="128" height="26" rx="8" fill="#edf4f8" stroke="#0369a1" stroke-width="1" /><text x="474.0" y="204.6" font-size="10" font-weight="400" fill="#0369a1" text-anchor="middle" >本地 ASR 模型</text><path d="M474 214 V226" fill="none" stroke="#0369a1" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="780" y="188" width="160" height="26" rx="8" fill="#edf4f8" stroke="#a16207" stroke-width="1" /><text x="860.0" y="204.6" font-size="10" font-weight="400" fill="#a16207" text-anchor="middle" >只读 YAML，不硬编码</text><path d="M860 214 V226" fill="none" stroke="#a16207" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M860 322 V350" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><path d="M240 350 H880" stroke="#c9d9e4" stroke-width="1.2" fill="none"/><path d="M240 350 V376" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="150" y="376" width="180" height="66" rx="12" fill="#ffffff" stroke="#c9d9e4" stroke-width="1.2" /><text x="164" y="402" font-size="13" font-weight="600" fill="#0c1a25" text-anchor="start" >shots.json</text><text x="164" y="424" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >可 diff 的 ShotSheet</text><path d="M520 350 V376" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="430" y="376" width="180" height="66" rx="12" fill="#ffffff" stroke="#c9d9e4" stroke-width="1.2" /><text x="444" y="402" font-size="13" font-weight="600" fill="#0c1a25" text-anchor="start" >shotlist.html</text><text x="444" y="424" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >A4 打印分镜表</text><path d="M810 350 V376" fill="none" stroke="#516a7d" stroke-width="1.6" class="flow" marker-end="url(#arrow)"/><rect x="720" y="376" width="180" height="66" rx="12" fill="#ffffff" stroke="#c9d9e4" stroke-width="1.2" /><text x="734" y="402" font-size="13" font-weight="600" fill="#0c1a25" text-anchor="start" >剪映 draft</text><text x="734" y="424" font-size="10" font-weight="400" fill="#516a7d" text-anchor="start" >draft_content.json + meta</text><text x="40" y="480" font-size="11" font-weight="400" fill="#516a7d" text-anchor="start" >规则唯一来源 rules/cn-platforms.yaml；换平台只改 YAML。</text>
</svg>
