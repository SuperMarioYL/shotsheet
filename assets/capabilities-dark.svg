<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="t d">
<title id="t">ShotSheet 能力与集成</title>
<desc id="d">输入、视觉 provider、平台规则与两类输出的连接图。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .flow { stroke-dasharray: 5 8; animation: flow 2.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .32; } 50% { opacity: 1; } }
  .drift { animation: drift 4.2s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
  .travel { animation: travel 7s linear infinite; }
  @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(700px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .drift, .travel, .spin, .float { animation: none !important; }
  }
</style>
<defs>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#1b2a37" stroke-width="1" stroke-opacity=".55"/>
  </pattern>
  <radialGradient id="glow" cx="62%" cy="42%" r="68%">
    <stop offset="0" stop-color="#5eead4" stop-opacity=".20"/>
    <stop offset=".55" stop-color="#7dd3fc" stop-opacity=".07"/>
    <stop offset="1" stop-color="#070c12" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="980" height="520" fill="#070c12"/>
<rect width="980" height="520" fill="url(#grid)"/>
<rect width="980" height="520" fill="url(#glow)"/>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea3b5"/></marker><text x="40" y="46" font-size="20" font-weight="700" fill="#e8f2f8" text-anchor="start" >能力与集成</text><text x="40" y="70" font-size="12" font-weight="400" fill="#8ea3b5" text-anchor="start" >一个 ShotSheet 契约，接的是本地分析、两个视觉 provider 和三套平台规则。</text><circle cx="490" cy="250" r="118" fill="none" stroke="#263543" stroke-width="1" stroke-dasharray="3 7"/><circle cx="490" cy="250" r="178" fill="none" stroke="#263543" stroke-width="1" stroke-dasharray="3 9"/><circle cx="490" cy="250" r="236" fill="none" stroke="#263543" stroke-width="1" stroke-dasharray="3 11"/><circle cx="490" cy="250" r="86" fill="#0e1721" stroke="#5eead4" stroke-width="1.4"/><text x="490" y="240" font-size="15" font-weight="700" fill="#5eead4" text-anchor="middle" >ShotSheet 契约</text><text x="490" y="264" font-size="12" font-weight="400" fill="#e8f2f8" text-anchor="middle" >shots.json</text><text x="490" y="284" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="middle" >tc_in · rules#platform</text><rect x="150" y="108" width="200" height="58" rx="10" fill="#0e1721" stroke="#7dd3fc" stroke-width="1.2" /><text x="164" y="132" font-size="12.5" font-weight="600" fill="#7dd3fc" text-anchor="start" >本地视频输入</text><text x="164" y="151" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >mp4 · mov · mkv</text><path d="M250.0 137.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="730" y="108" width="200" height="58" rx="10" fill="#0e1721" stroke="#7dd3fc" stroke-width="1.2" /><text x="744" y="132" font-size="12.5" font-weight="600" fill="#7dd3fc" text-anchor="start" >视觉 provider</text><text x="744" y="151" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >豆包 · 通义 qwen3-vl</text><path d="M830.0 137.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="820" y="250" width="140" height="58" rx="10" fill="#0e1721" stroke="#f5c76a" stroke-width="1.2" /><text x="834" y="274" font-size="12.5" font-weight="600" fill="#f5c76a" text-anchor="start" >平台规则</text><text x="834" y="293" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >抖音·小红书·视频号</text><path d="M890.0 279.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="700" y="418" width="220" height="58" rx="10" fill="#0e1721" stroke="#5eead4" stroke-width="1.2" /><text x="714" y="442" font-size="12.5" font-weight="600" fill="#5eead4" text-anchor="start" >打印物料</text><text x="714" y="461" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >A4 分镜表 HTML</text><path d="M810.0 447.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="150" y="418" width="220" height="58" rx="10" fill="#0e1721" stroke="#5eead4" stroke-width="1.2" /><text x="164" y="442" font-size="12.5" font-weight="600" fill="#5eead4" text-anchor="start" >剪映参考时间线</text><text x="164" y="461" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >draft_content.json</text><path d="M260.0 447.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="60" y="250" width="130" height="58" rx="10" fill="#0e1721" stroke="#7dd3fc" stroke-width="1.2" /><text x="74" y="274" font-size="12.5" font-weight="600" fill="#7dd3fc" text-anchor="start" >本地 ASR</text><text x="74" y="293" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >faster-whisper</text><path d="M125.0 279.0 L490 250" fill="none" stroke="#263543" stroke-width="1" class="flow"/><rect x="390" y="84" width="200" height="46" rx="10" fill="#0e1721" stroke="#8ea3b5" stroke-width="1" stroke-dasharray="4 5"/><text x="404" y="108" font-size="12.5" font-weight="600" fill="#8ea3b5" text-anchor="start" >v0.2 规划（未实现）</text><text x="404" y="127" font-size="10" font-weight="400" fill="#8ea3b5" text-anchor="start" >批量队列 · 模板库</text><g class="spin"><circle cx="668" cy="250" r="4" fill="#5eead4" filter="url(#soft)"/></g><text x="40" y="504" font-size="10.5" font-weight="400" fill="#8ea3b5" text-anchor="start" >实线：v0.1 已实现　虚线：v0.2 规划</text>
</svg>
