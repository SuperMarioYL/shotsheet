[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shotsheet"
description = "Shot-level teardown for short-form video: shot boundaries, source timecodes, ASR captions, and a printable storyboard sheet."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SuperMarioYL" }]
keywords = ["video", "shot-list", "storyboard", "douyin", "xiaohongshu", "asr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dynamic = ["version"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "typer>=0.12",
  "scenedetect>=0.6",
  "faster-whisper>=1.0",
  # faster-whisper 1.2.x still calls av.open(metadata_errors=...), which av 19 dropped.
  "av>=12,<19",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.scripts]
shotsheet = "shotsheet.cli:app"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '^(?P<version>\d+\.\d+\.\d+)$'

[tool.hatch.build.targets.wheel]
packages = ["src/shotsheet"]
exclude = ["**/.gitkeep"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
