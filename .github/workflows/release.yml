name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Write checksums
        run: |
          cd dist
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "shotsheet $tag" --generate-notes
          status=0
          for asset in dist/*; do
            name="$(basename "$asset")"
            attached=0
            for attempt in 1 2 3; do
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$name"; then
                echo "already attached: $name"
                attached=1
                break
              fi
              if gh release upload "$tag" "$asset"; then
                echo "attached: $name"
                attached=1
                break
              fi
              echo "attempt $attempt failed for $name; retrying" >&2
              sleep 3
            done
            if [ "$attached" -ne 1 ]; then
              echo "::error::could not attach $name to $tag"
              status=1
            fi
          done
          exit "$status"

  # Opt-in PyPI trusted publishing. A fresh repo has no Trusted Publisher
  # registered, so this job is gated behind the PYPI_PUBLISH repository
  # variable and stays skipped until publishing is actually configured.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shotsheet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Drop non-distribution files
        run: rm -f dist/checksums.txt

      - uses: pypa/gh-action-pypi-publish@release/v1
